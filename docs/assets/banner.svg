<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="FUCK WHATSAPP — No phone. No email. No central account. No Meta.">
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <clipPath id="card"><rect x="6" y="6" width="1268" height="408" rx="26"/></clipPath>
    <style>
      .fade0{opacity:0;animation:fade .6s ease forwards}
      .r1{animation-delay:.15s}.r2{animation-delay:1.05s}.r3{animation-delay:1.25s}
      .c1{animation-delay:1.55s}.c2{animation-delay:1.75s}.c3{animation-delay:1.95s}.c4{animation-delay:2.15s}
      @keyframes fade{to{opacity:1}}
      .caret{animation:blink 1.05s steps(1) infinite;animation-delay:2.3s}
      @keyframes blink{50%{opacity:0}}
      .scan{animation:scan 6s cubic-bezier(.4,0,.2,1) infinite;animation-delay:1s}
      @keyframes scan{0%{transform:translateY(-40px);opacity:0}8%{opacity:.9}45%{opacity:.15}92%{opacity:0}100%{transform:translateY(430px);opacity:0}}
      .slash{stroke-dasharray:64;stroke-dashoffset:64;animation:draw .7s ease forwards;animation-delay:.5s}
      @keyframes draw{to{stroke-dashoffset:0}}
      .bar{transform-origin:center bottom;animation:eq 2.2s ease-in-out infinite}
      @keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      @media (prefers-reduced-motion:reduce){*{animation:none!important}.fade0{opacity:1}.slash{stroke-dashoffset:0}}
    </style>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="1268" height="408" rx="26" fill="url(#edge)" stroke="#272727" stroke-width="2"/>

  <g clip-path="url(#card)">
    <!-- faint equaliser "signal" bars, low opacity green -->
    <g opacity="0.10" fill="#b8ff3d">
      <rect class="bar" x="70"  y="120" width="10" height="180" style="animation-delay:0s"/>
      <rect class="bar" x="96"  y="120" width="10" height="180" style="animation-delay:.2s"/>
      <rect class="bar" x="122" y="120" width="10" height="180" style="animation-delay:.5s"/>
      <rect class="bar" x="1150" y="120" width="10" height="180" style="animation-delay:.35s"/>
      <rect class="bar" x="1176" y="120" width="10" height="180" style="animation-delay:.6s"/>
      <rect class="bar" x="1202" y="120" width="10" height="180" style="animation-delay:.1s"/>
    </g>
    <!-- surveillance scan line, sweeps down and fades (crossed out by the brand) -->
    <rect class="scan" x="6" y="0" width="1268" height="2" fill="#b8ff3d" opacity="0"/>

    <!-- F/W severed-connection mark -->
    <g transform="translate(560,54)">
      <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="none" stroke="#f5f5f5" stroke-width="3.4"/>
      <path class="slash" d="M42 12 L21 52" stroke="#b8ff3d" stroke-width="4.4" stroke-linecap="round"/>
      <path d="M16 18 h12 M16 18 v28 M16 31 h9" fill="none" stroke="#f5f5f5" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M36 20 l4 26 4-15 4 15 4-26" fill="none" stroke="#f5f5f5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- wordmark -->
    <g text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-weight="800" letter-spacing="-2">
      <text class="fade0 r1" x="640" y="215" font-size="120" fill="#f5f5f5">FUCK</text>
      <text class="fade0 r2" x="640" y="325" font-size="120" fill="#f5f5f5">WHAT<tspan fill="#b8ff3d">SAPP</tspan><tspan class="caret" fill="#b8ff3d" dx="6">_</tspan></text>
    </g>

    <!-- tagline chips -->
    <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="600" font-size="20" fill="#c9c9c9" text-anchor="middle">
      <g class="fade0 c1"><rect x="300" y="360" width="128" height="36" rx="18" fill="#141414" stroke="#2d2d2d"/><text x="364" y="384">No phone</text></g>
      <g class="fade0 c2"><rect x="440" y="360" width="126" height="36" rx="18" fill="#141414" stroke="#2d2d2d"/><text x="503" y="384">No email</text></g>
      <g class="fade0 c3"><rect x="578" y="360" width="230" height="36" rx="18" fill="#141414" stroke="#2d2d2d"/><text x="693" y="384">No central account</text></g>
      <g class="fade0 c4"><rect x="820" y="360" width="118" height="36" rx="18" fill="#141414" stroke="#2d2d2d"/><text x="879" y="384">No Meta</text></g>
    </g>
  </g>
</svg>
